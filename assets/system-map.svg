<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">From signal to system</title>
  <desc id="desc">A diagram showing data flowing through memory and agent systems into useful outputs, with evaluation feeding back into the system.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d10" />
      <stop offset="1" stop-color="#11161a" />
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5fcf80" stop-opacity=".25" />
      <stop offset=".5" stop-color="#5fcf80" />
      <stop offset="1" stop-color="#5fcf80" stop-opacity=".25" />
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#5fcf80" stroke-opacity=".055" stroke-width="1" />
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="18" fill="url(#bg)" />
  <rect x="1" y="1" width="1198" height="358" rx="17" fill="url(#grid)" stroke="#263239" />

  <g font-family="monospace">
    <text x="44" y="48" fill="#5fcf80" font-size="12" letter-spacing="2.4">SYSTEM MAP</text>
    <text x="44" y="78" fill="#e7ece9" font-size="24" font-weight="700">From signal to system</text>
    <text x="44" y="104" fill="#8b9791" font-size="13">data in / context assembled / decisions inspected</text>

    <g transform="translate(44 150)">
      <rect width="188" height="120" rx="12" fill="#11191a" stroke="#2a4436" />
      <text x="20" y="28" fill="#5fcf80" font-size="10" letter-spacing="1.5">INPUTS</text>
      <text x="20" y="57" fill="#e7ece9" font-size="16" font-weight="700">real signals</text>
      <text x="20" y="79" fill="#8b9791" font-size="12">documents / users</text>
      <text x="20" y="99" fill="#8b9791" font-size="12">sensors / events</text>
      <circle cx="158" cy="32" r="5" fill="#5fcf80" filter="url(#glow)" />
    </g>

    <g transform="translate(340 150)">
      <rect width="206" height="120" rx="12" fill="#11191a" stroke="#2a4436" />
      <text x="20" y="28" fill="#5fcf80" font-size="10" letter-spacing="1.5">MEMORY</text>
      <text x="20" y="57" fill="#e7ece9" font-size="16" font-weight="700">retrieve context</text>
      <text x="20" y="79" fill="#8b9791" font-size="12">vector search / graph</text>
      <text x="20" y="99" fill="#8b9791" font-size="12">rerank / filter / trace</text>
      <circle cx="176" cy="32" r="5" fill="#5fcf80" filter="url(#glow)" />
    </g>

    <g transform="translate(654 150)">
      <rect width="206" height="120" rx="12" fill="#11191a" stroke="#2a4436" />
      <text x="20" y="28" fill="#5fcf80" font-size="10" letter-spacing="1.5">ORCHESTRATION</text>
      <text x="20" y="57" fill="#e7ece9" font-size="16" font-weight="700">agents + tools</text>
      <text x="20" y="79" fill="#8b9791" font-size="12">route / call / observe</text>
      <text x="20" y="99" fill="#8b9791" font-size="12">fail clearly / retry wisely</text>
      <circle cx="176" cy="32" r="5" fill="#5fcf80" filter="url(#glow)" />
    </g>

    <g transform="translate(968 150)">
      <rect width="188" height="120" rx="12" fill="#132019" stroke="#5fcf80" stroke-opacity=".55" />
      <text x="20" y="28" fill="#5fcf80" font-size="10" letter-spacing="1.5">OUTPUT</text>
      <text x="20" y="57" fill="#e7ece9" font-size="16" font-weight="700">useful results</text>
      <text x="20" y="79" fill="#8b9791" font-size="12">API / workflow / insight</text>
      <text x="20" y="99" fill="#8b9791" font-size="12">with a reason to trust it</text>
      <circle cx="158" cy="32" r="5" fill="#5fcf80" filter="url(#glow)" />
    </g>

    <g fill="none" stroke="url(#line)" stroke-width="2">
      <path d="M232 210H340" />
      <path d="M546 210H654" />
      <path d="M860 210H968" />
      <path d="M1062 270 C1062 320 440 320 440 270" stroke-dasharray="5 7" opacity=".75" />
    </g>
    <g fill="#5fcf80">
      <path d="M332 204l10 6-10 6z" />
      <path d="M646 204l10 6-10 6z" />
      <path d="M960 204l10 6-10 6z" />
      <path d="M448 264l-8 10-6-10z" opacity=".8" />
    </g>
    <text x="612" y="340" fill="#5fcf80" font-size="10" letter-spacing="1.2" text-anchor="middle">EVALUATE / LEARN / IMPROVE</text>
  </g>
</svg>
